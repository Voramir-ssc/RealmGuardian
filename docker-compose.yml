services:
  realmguardian-backend:
    container_name: realmguardian-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - /opt/docker/appdata/realmguardian/realmguardian.db:/app/realmguardian.db
      - /opt/docker/appdata/realmguardian/config.json:/app/config.json
      - /opt/docker/appdata/realmguardian/backups:/app/backups
      - /opt/docker/appdata/realmguardian/backend.log:/app/backend.log
    environment:
      - PYTHONUNBUFFERED=1
      - BACKUP_PATH=/app/backups
      - TZ=Europe/Berlin
    ports:
      - "8000:8000"
    networks:
      - core-net

  realmguardian-frontend:
    container_name: realmguardian-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - realmguardian-backend
    ports:
      - "5173:80"
    networks:
      - core-net

networks:
  core-net:
    external: true
